<!-- _includes/certification-card.html -->
<div class="cert-card">
  <div class="cert-card-image-wrapper">
    <img src="{{ include.image | relative_url }}" alt="{{ include.title }} logo" class="cert-card-image">
  </div>
  <div class="cert-card-content">
    <h3 class="cert-card-title">{{ include.title }}</h3>
    <p class="cert-card-issuer">
      Issued by 
      {% assign issuer_html = include.issuer | markdownify %}
      {{ issuer_html | remove: '<p>' | remove: '</p>' }}
    </p>
    <p class="cert-card-date">{{ include.date }}</p>
    {% if include.link %}
    <div class="cert-card-button-container">
      <a href="{{ include.link }}" class="cert-card-button" target="_blank" rel="noopener">View Credential</a>
    </div>
    {% endif %}
  </div>
</div>

<style>
.cert-card {
  display: flex;
  align-items: stretch;
  gap: 1rem;
  padding: 1rem;
  margin-bottom: 1rem;
  border: 1px solid #e5e7eb;
  border-radius: 0.75rem;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  max-width: 800px;
}
.cert-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.cert-card-image-wrapper {
  flex: 0 0 35%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f9fafb;
  border-radius: 0.5rem;
  overflow: hidden;
}
.cert-card-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.cert-card-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cert-card-title {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 600;
}
.cert-card-issuer {
  margin: 0.25rem 0;
  color: #555;
  font-size: 0.9rem;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 0.3rem;
}
.cert-card-issuer a {
  color: #2563eb;
  text-decoration: none;
  white-space: nowrap;
}
.cert-card-issuer a:hover {
  text-decoration: underline;
}
.cert-card-date {
  margin: 0.25rem 0;
  color: #555;
  font-size: 0.9rem;
}
.cert-card-button-container {
  display: flex;
  justify-content: flex-end;
  margin-top: 0.5rem;
}
.cert-card-button {
  display: inline-block;
  padding: 0.35rem 0.75rem;
  background: #2563eb;
  color: white;
  border-radius: 0.375rem;
  text-decoration: none;
  font-size: 0.85rem;
  white-space: nowrap;
  width: auto;
}
.cert-card-button:hover {
  background: #1d4ed8;
}
</style>
